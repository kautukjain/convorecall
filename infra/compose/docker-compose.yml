name: convorecall

services:
  postgres:
    image: postgres:16-alpine
    container_name: convorecall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convorecall
      POSTGRES_PASSWORD: convorecall
      POSTGRES_DB: convorecall
    ports:
      # Host 5433 on purpose: 5432 is usually taken by a locally installed Postgres,
      # and silently connecting to the wrong server is a miserable first-run failure.
      - "5433:5432"
    volumes:
      - convorecall-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convorecall -d convorecall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  convorecall-pgdata:
